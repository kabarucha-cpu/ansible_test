---

- hosts: all
  become: true
  pre_tasks:

  - name: Install updates
    tags: upd
    apt:
      upgrade: dist
      update_cache: yes
    when: ansible_distribution == "Ubuntu"


- hosts: web_servers
  become: true
  tasks:

  - name: Install apache2 and php package for Ubuntu
    tags: apache
    apt:
      name:
        - apache2
        - libapache2-mod-php
      state: latest
    when: ansible_distribution == "Ubuntu"

- hosts: db_servers
  become: true
  tasks:

  - name: Install mariadb package (Ubuntu) 
    tags: db
    apt:
      name: mariadb-server
      state: latest
    when: ansible_distribution == "Ubuntu"
